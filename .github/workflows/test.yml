name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # luarocks runs on PUC Lua 5.1: under LuaJIT it cannot load the luarocks.org manifest
      # ("main function has more than 65536 constants"). The tests still run on LuaJIT.
      - run: sudo apt-get update && sudo apt-get install -y luajit lua5.1 liblua5.1-0-dev luarocks
      - run: sudo luarocks --lua-version=5.1 install busted
      - run: sudo luarocks --lua-version=5.1 install luacheck
      - run: luacheck kindlemtp.koplugin spec
      - run: busted --lua=luajit
