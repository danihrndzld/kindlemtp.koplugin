name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: zip -r kindlemtp.koplugin.zip kindlemtp.koplugin -x "*.git*" "*/.*"
      - uses: softprops/action-gh-release@v2
        with:
          files: kindlemtp.koplugin.zip
          generate_release_notes: true
